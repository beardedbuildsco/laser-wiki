# Bearded Builds Laser Wiki
site_name: Bearded Builds Laser Wiki
site_url: https://learn.beardedbuildsco.com/
site_description: Practical laser engraving guides from Bearded Builds Co — machines, materials, LightBurn, safety, and shop tips.
site_author: Bearded Builds Co

repo_name: beardedbuildsco/laser-wiki
repo_url: https://github.com/beardedbuildsco/laser-wiki

theme:
  name: material
  custom_dir: overrides
  palette:
    # Light "Laser Learning Lab" scheme first so it is the default, matching course.beardedbuildsco.com
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  logo: assets/laser-learning-lab-logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: Roboto Mono

plugins:
  - search

extra_javascript:
  - javascripts/click-tracking.js

extra_css:
  - stylesheets/extra.css

copyright: Bearded Builds Co. All rights reserved. &copy; 2026

extra:
  analytics:
    provider: google
    property: G-S50E718CQ0
  generator: false
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@BeardedBuildsCo
      name: Bearded Builds Co on YouTube
    - icon: fontawesome/solid/store
      link: https://beardedbuildsco.com
      name: Bearded Builds shop
    - icon: fontawesome/solid/graduation-cap
      link: https://course.beardedbuildsco.com/master-lightburn
      name: Master LightBurn course
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/beardedbuildsco
      name: Bearded Builds Co on Instagram
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/beardedbuildsco
      name: Bearded Builds Co on Facebook

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Buying guides:
      - Laser buying guide: buying-guides/laser-buying-guide.md
      - Diode laser buying guide: buying-guides/diode-buying-guide.md
  - Gear I use: buying-guides/gear-we-use.md
  - Machines:
      - Laser types: machines/laser-types.md
      - Focus and alignment: machines/focus-and-alignment.md
      - Ventilation and safety: machines/ventilation-and-safety.md
      - CO2 tube and mirror maintenance: machines/co2-tube-and-mirror-maintenance.md
      - Fiber laser basics and marking: machines/fiber-laser-basics-and-marking.md
      - UV lasers: machines/uv-lasers.md
  - Setup guides:
      - OneLaser X-Series (XT / XRF): reference/onelaser-x-series-setup.md
      - OneLaser Hydra Gen2: reference/onelaser-hydra-setup.md
      - OneLaser Cobra: reference/onelaser-cobra-setup.md
      - OMTech CO2 laser: reference/omtech-setup-guide.md
  - Materials:
      - What you can laser: materials/what-you-can-laser.md
      - Starter settings: materials/starter-settings.md
      - Fiber metal marking: materials/fiber-metal-marking.md
      - Engraving slate: materials/engraving-slate.md
  - LightBurn:
      - LightBurn basics: lightburn/lightburn-basics.md
  - Troubleshooting:
      - Common LightBurn errors: troubleshooting/common-lightburn-errors.md
      - CO2 common problems: troubleshooting/co2-common-problems.md
      - Fiber common problems: troubleshooting/fiber-common-problems.md
  - Safety:
      - Laser eye safety and fire: safety/laser-eye-safety-and-fire.md
  - Projects:
      - Engraving a plaque: projects/engraving-a-plaque.md
      - Rotary engraving: projects/rotary-engraving.md
  - Business:
      - Pricing laser work: business/pricing-laser-work.md
      - Finding customers: business/finding-customers.md
  - Common mistakes: common-mistakes.md
  - Glossary: glossary.md
